<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f1115">
<title>dio</title>
<script>
// Определяем устройство ДО отрисовки, чтобы не было «прыжка» дизайна.
(function () {
  var ua = navigator.userAgent, phone = false;
  if (navigator.userAgentData && navigator.userAgentData.mobile) phone = true;
  else if (/Android|iPhone|iPod|Windows Phone|Mobile|Opera Mini|IEMobile/i.test(ua)) phone = true;
  // iPad/планшеты на iPadOS притворяются Mac — тач-экран с узкой стороной < 600px считаем телефоном
  else if (matchMedia('(pointer:coarse)').matches && Math.min(screen.width, screen.height) < 600) phone = true;
  document.documentElement.dataset.device = phone ? 'phone' : 'pc';
})();
</script>
<style>
:root {
  --bg:#0f1115; --panel:#161a21; --panel2:#1d222b; --line:#262c37;
  --text:#e8ebf0; --muted:#8a93a3; --accent:#5b8cff;
  --mine:#2b4a8f; --theirs:#1f252f; --danger:#ff6b6b; --ok:#3ecf8e;
}
* { box-sizing:border-box; margin:0; padding:0 }
html, body { height:100% }
body { background:var(--bg); color:var(--text); font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100% }
button { font:inherit; cursor:pointer; border:0; background:none; color:inherit }
button:disabled { cursor:default }
input, textarea { font:inherit; color:inherit }
svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0 }
.hidden { display:none !important }

/* ---------- общие элементы ---------- */
.field { width:100%; padding:11px 12px; background:var(--panel2); border:1px solid var(--line); border-radius:10px; margin-bottom:10px; outline:none; resize:none }
.field:focus { border-color:var(--accent) }
.btn { width:100%; padding:11px; background:var(--accent); color:#fff; border-radius:10px; font-weight:600 }
.btn:disabled { opacity:.5 }
.btn.small { width:auto; padding:7px 16px; border-radius:20px; font-size:14px }
.btn.ghost { background:none; border:1px solid var(--line); color:var(--text) }
.btn.ghost:hover { background:var(--panel2) }
.err { color:var(--danger); font-size:13px; min-height:18px; margin-top:8px; text-align:center }
.empty, .loader { color:var(--muted); text-align:center; padding:24px 16px; font-size:14px }
.loader:empty { padding:0; height:1px }
.ava { width:46px; height:46px; border-radius:50%; flex-shrink:0; display:grid; place-items:center; font-weight:700; color:#fff; position:relative; font-size:17px; user-select:none }
.ava.on::after { content:""; position:absolute; right:0; bottom:0; width:12px; height:12px; border-radius:50%; background:var(--ok); border:2px solid var(--panel) }
.icon-btn { width:38px; height:38px; border-radius:50%; display:grid; place-items:center; color:var(--muted); flex-shrink:0 }
.icon-btn:hover { background:var(--panel2); color:var(--text) }
#conn { position:fixed; top:calc(10px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--line); padding:6px 14px; border-radius:20px; font-size:13px; color:var(--muted); z-index:50; white-space:nowrap; pointer-events:none }

/* ---------- вход ---------- */
#auth { height:100dvh; display:grid; place-items:center; padding:16px }
.card { width:100%; max-width:360px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:28px 24px }
.logo { font-size:36px; font-weight:800; letter-spacing:-1px; text-align:center }
.logo span, .nav-logo span { color:var(--accent) }
.sub { text-align:center; color:var(--muted); margin-bottom:20px; font-size:13px }
.tabs { display:flex; background:var(--panel2); border-radius:10px; padding:3px; margin-bottom:16px }
.tabs button { flex:1; padding:8px; border-radius:8px; color:var(--muted) }
.tabs button.on { background:var(--line); color:var(--text) }

/* ---------- каркас: навигация + разделы ---------- */
#app { height:100dvh; display:flex }
#nav { width:76px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; position:relative }
.nav-logo { position:absolute; top:calc(16px + env(safe-area-inset-top)); left:0; right:0; text-align:center; font-weight:800; font-size:24px; letter-spacing:-1px; user-select:none }
.nav-btn { width:50px; height:50px; border-radius:14px; display:grid; place-items:center; color:var(--muted); position:relative }
.nav-btn:hover { background:var(--panel2); color:var(--text) }
.nav-btn.on { background:var(--line); color:var(--accent) }
.nav-btn svg { width:24px; height:24px }
.nav-btn .ava { width:34px; height:34px; font-size:14px }
.nav-btn.on .ava { box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--accent) }
.nav-badge { position:absolute; top:3px; right:2px; min-width:18px; height:18px; border-radius:9px; background:var(--danger); color:#fff; font-size:11px; font-weight:700; display:grid; place-items:center; padding:0 5px }
#views { flex:1; min-width:0; position:relative }
.view { position:absolute; inset:0; overflow-y:auto; display:none; overscroll-behavior:contain }
.view.on { display:block }
#vMessages.on { display:flex; overflow:hidden }
.col { max-width:640px; margin:0 auto; min-height:100%; border-left:1px solid var(--line); border-right:1px solid var(--line) }
.top { position:sticky; top:0; z-index:5; background:rgba(15,17,21,.86); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top) }
.top h1 { font-size:20px; padding:14px 16px 4px; display:flex; align-items:center; gap:8px }
.top h1 .icon-btn { margin:-6px 0 -6px -8px }

/* ---------- лента ---------- */
.feed-top { padding:calc(16px + env(safe-area-inset-top)) 16px 16px; border-bottom:1px solid var(--line) }
.create-btn { width:100%; display:flex; align-items:center; justify-content:center; gap:8px; padding:13px; border-radius:14px; background:var(--accent); color:#fff; font-weight:700; font-size:16px }
.create-btn:hover { filter:brightness(1.08) }
.create-btn svg { width:22px; height:22px; stroke-width:2.5 }
.pill { position:sticky; top:calc(10px + env(safe-area-inset-top)); z-index:5; display:block; margin:10px auto 0; background:var(--accent); color:#fff; font-size:14px; font-weight:600; padding:6px 16px; border-radius:20px; box-shadow:0 4px 16px rgba(0,0,0,.4) }
.verified { display:inline-grid; place-items:center; width:16px; height:16px; border-radius:50%; background:var(--accent); color:#fff; flex-shrink:0 }
.verified svg { width:11px; height:11px; stroke-width:3.5 }
.prof-name .verified { width:20px; height:20px; vertical-align:-2px; margin-left:6px }
.prof-name .verified svg { width:13px; height:13px }

/* окно создания поста */
.modal { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.6); display:flex; align-items:flex-start; justify-content:center; padding:8vh 16px 16px }
.sheet { width:100%; max-width:600px; background:var(--panel); border:1px solid var(--line); border-radius:18px; display:flex; flex-direction:column; max-height:84vh }
.sheet-head { display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:1px solid var(--line); font-weight:700 }
.new-post { display:flex; gap:12px; padding:14px 16px; overflow-y:auto }
.new-post .ava { width:44px; height:44px }
#postInput { flex:1; min-width:0; background:none; border:0; outline:none; resize:none; font-size:17px; min-height:120px; padding:10px 0 }
.new-post-foot { display:flex; justify-content:flex-end; align-items:center; gap:12px; padding:10px 16px; border-top:1px solid var(--line) }
.counter { color:var(--muted); font-size:13px }
.counter.over { color:var(--danger) }
.post { display:flex; gap:12px; padding:14px 16px 8px; border-bottom:1px solid var(--line) }
.post .ava { width:44px; height:44px; cursor:pointer }
.post-main { flex:1; min-width:0 }
.post-head { display:flex; gap:6px; align-items:center; min-width:0 }
.post-name { font-weight:700; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex-shrink:1 }
.post-name:hover { text-decoration:underline }
.post-sub { color:var(--muted); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1 }
.post-del { color:var(--muted); width:30px; height:30px; border-radius:50%; display:grid; place-items:center; margin:-6px -6px -6px 0 }
.post-del svg { width:17px; height:17px }
.post-del:hover { color:var(--danger); background:rgba(255,107,107,.1) }
.post-body { white-space:pre-wrap; overflow-wrap:anywhere; margin-top:2px; font-size:15.5px }
.post-actions { display:flex; gap:16px; margin:6px 0 0 -8px }
.act { display:flex; align-items:center; gap:6px; color:var(--muted); padding:5px 8px; border-radius:16px; font-size:14px }
.act svg { width:19px; height:19px }
.act:hover { color:var(--danger); background:rgba(255,107,107,.1) }
.act.liked { color:var(--danger) }
.act.liked svg { fill:currentColor }

/* ---------- профиль ---------- */
.prof { padding:20px 16px 16px; border-bottom:1px solid var(--line) }
.prof-top { display:flex; align-items:flex-end; justify-content:space-between; gap:12px }
.ava.big { width:92px; height:92px; font-size:36px }
.ava.big.on::after { width:18px; height:18px; border-width:3px; border-color:var(--bg); right:4px; bottom:4px }
.prof-btns { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end }
.prof-name { font-size:22px; font-weight:800; margin-top:12px; overflow-wrap:anywhere }
.prof-user { color:var(--muted) }
.prof-bio { margin-top:10px; white-space:pre-wrap; overflow-wrap:anywhere }
.prof-stats { display:flex; gap:18px; margin-top:12px; color:var(--muted); font-size:14px; flex-wrap:wrap }
.prof-stats b { color:var(--text) }
.prof textarea.field { min-height:80px }

/* ---------- сообщения ---------- */
#side { width:340px; flex-shrink:0; border-right:1px solid var(--line); display:flex; flex-direction:column; background:var(--panel) }
.side-head { padding:calc(14px + env(safe-area-inset-top)) 16px 10px; font-size:20px; font-weight:700 }
.field.search { width:auto; margin:0 12px 8px }
#list { flex:1; overflow-y:auto }
.item { display:flex; gap:12px; padding:10px 12px; cursor:pointer; align-items:center }
.item:hover { background:var(--panel2) }
.item.on { background:var(--line) }
.meta { flex:1; min-width:0 }
.row { display:flex; justify-content:space-between; gap:8px; align-items:center }
.title { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.time { color:var(--muted); font-size:12px; flex-shrink:0 }
.prev { color:var(--muted); font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1 }
.prev.typing { color:var(--accent) }
.badge { background:var(--accent); color:#fff; border-radius:10px; font-size:12px; padding:1px 7px; font-weight:600; flex-shrink:0 }
.section { color:var(--muted); font-size:12px; padding:8px 12px 4px; text-transform:uppercase; letter-spacing:.5px }
#main { flex:1; display:flex; flex-direction:column; min-width:0 }
#placeholder { flex:1; display:grid; place-items:center; color:var(--muted); padding:16px; text-align:center }
#chat { flex:1; display:flex; flex-direction:column; min-height:0 }
.chat-head { display:flex; align-items:center; gap:10px; padding:calc(8px + env(safe-area-inset-top)) 12px 8px; border-bottom:1px solid var(--line); background:var(--panel); min-height:58px }
.chat-head .ava { width:38px; height:38px; font-size:15px; cursor:pointer }
.chat-head .title { cursor:pointer }
#back { display:none }
.status { color:var(--muted); font-size:13px }
.status.online, .status.typing { color:var(--accent) }
#msgs { flex:1; overflow-y:auto; padding:12px 12px 6px; display:flex; flex-direction:column; gap:3px; overscroll-behavior:contain }
.day { align-self:center; color:var(--muted); font-size:12px; background:var(--panel2); padding:3px 10px; border-radius:10px; margin:10px 0 6px }
.msg { max-width:min(75%, 560px); padding:7px 10px 5px; border-radius:14px; background:var(--theirs); align-self:flex-start; white-space:pre-wrap; overflow-wrap:anywhere }
.msg.mine { background:var(--mine); align-self:flex-end }
.msg .info { float:right; margin:6px 0 -3px 10px; font-size:11px; color:rgba(255,255,255,.55); display:inline-flex; gap:3px; align-items:center; white-space:nowrap }
.tick.read { color:#9fc0ff }
.msg.pending { opacity:.75 }
.msg.failed { cursor:pointer }
.msg.failed .info { color:var(--danger) }
#composer { display:flex; gap:8px; padding:8px 12px calc(12px + env(safe-area-inset-bottom)); align-items:flex-end; border-top:1px solid var(--line); background:var(--panel) }
#input { flex:1; resize:none; max-height:160px; padding:10px 14px; border-radius:20px; background:var(--panel2); border:1px solid var(--line); outline:none; line-height:1.35 }
#input:focus { border-color:var(--accent) }
#send { width:42px; height:42px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; flex-shrink:0 }

/* узкое окно (и телефон): в сообщениях показываем либо список, либо чат */
.compact #side { width:100%; border-right:0 }
.compact #main { display:none }
.compact body.in-chat #side { display:none }
.compact body.in-chat #main { display:flex }
.compact #back { display:grid }
.compact .msg { max-width:85% }

/* ---------- ТЕЛЕФОН: навигация снизу, контент на всю ширину ---------- */
[data-device=phone] #app { flex-direction:column-reverse }
[data-device=phone] #nav { width:auto; flex-direction:row; justify-content:space-around; gap:0; border-right:0; border-top:1px solid var(--line); padding:4px 0 calc(4px + env(safe-area-inset-bottom)) }
[data-device=phone] .nav-logo { display:none }
[data-device=phone] .nav-btn { width:64px; height:48px }
[data-device=phone] .nav-btn.on { background:none }
[data-device=phone] .nav-btn .ava { width:30px; height:30px; font-size:13px }
[data-device=phone] body.in-chat #nav { display:none }
[data-device=phone] .col { border:0 }
[data-device=phone] .top h1 { font-size:18px; padding-top:10px }
[data-device=phone] .post { padding:12px 14px 6px; gap:10px }
[data-device=phone] .post .ava, [data-device=phone] .new-post .ava { width:40px; height:40px; font-size:15px }
[data-device=phone] .post-body { font-size:15px }
[data-device=phone] #postInput { font-size:16px } /* 16px — чтобы iOS не зумил поле */
[data-device=phone] .modal { padding:0 }
[data-device=phone] .sheet { max-width:none; max-height:none; height:100dvh; border:0; border-radius:0; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom) }
[data-device=phone] .new-post { flex:1 }
[data-device=phone] #input { font-size:16px }
[data-device=phone] .ava.big { width:76px; height:76px; font-size:30px }
[data-device=phone] .prof-btns .btn.small { padding:6px 12px }
</style>
</head>
<body>

<div id="conn" class="hidden"></div>

<!-- ================= Вход ================= -->
<section id="auth" class="hidden">
  <form class="card" id="authForm">
    <div class="logo">di<span>o</span></div>
    <div class="sub">социальная сеть</div>
    <div class="tabs">
      <button type="button" data-mode="login" class="on">Вход</button>
      <button type="button" data-mode="register">Регистрация</button>
    </div>
    <input class="field" id="fUser" placeholder="Логин" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    <input class="field hidden" id="fName" placeholder="Имя (его видят другие)" autocomplete="nickname">
    <input class="field" id="fPass" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <button class="btn" id="fBtn">Войти</button>
    <div class="err" id="fErr"></div>
  </form>
</section>

<!-- ================= Приложение ================= -->
<section id="app" class="hidden">
  <nav id="nav">
    <div class="nav-logo">d<span>.</span></div>
    <button class="nav-btn" data-go="feed" title="Лента">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    </button>
    <button class="nav-btn" data-go="messages" title="Сообщения">
      <svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      <span class="nav-badge hidden" id="navBadge"></span>
    </button>
    <button class="nav-btn" data-go="me" title="Профиль">
      <div class="ava" id="navAva"></div>
    </button>
  </nav>

  <div id="views">
    <!-- Лента -->
    <section class="view" id="vFeed">
      <div class="col">
        <div class="feed-top">
          <button class="create-btn" id="createBtn">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            Создать
          </button>
        </div>
        <button class="pill hidden" id="newPosts"></button>
        <div id="feedList"></div>
        <div class="loader" id="feedMore"></div>
      </div>
    </section>

    <!-- Сообщения (директ) -->
    <section class="view" id="vMessages">
      <aside id="side">
        <div class="side-head">Сообщения</div>
        <input class="field search" id="search" placeholder="Найти по логину или имени" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div id="list"></div>
      </aside>
      <main id="main">
        <div id="placeholder">Выберите чат или найдите собеседника через поиск</div>
        <div id="chat" class="hidden">
          <div class="chat-head">
            <button class="icon-btn" id="back" title="Назад">
              <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div class="ava" id="peerAva"></div>
            <div class="meta">
              <div class="title" id="peerName"></div>
              <div class="status" id="peerStatus"></div>
            </div>
          </div>
          <div id="msgs"></div>
          <form id="composer">
            <textarea id="input" rows="1" placeholder="Сообщение" maxlength="4000"></textarea>
            <button id="send" title="Отправить">
              <svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            </button>
          </form>
        </div>
      </main>
    </section>

    <!-- Профиль -->
    <section class="view" id="vProfile">
      <div class="col">
        <div class="top">
          <h1>
            <button class="icon-btn hidden" id="profBack" title="Назад"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
            <span id="profTitle">Профиль</span>
          </h1>
          <div style="height:8px"></div>
        </div>
        <div class="prof" id="profHead"></div>
        <div id="profList"></div>
        <div class="loader" id="profMore"></div>
      </div>
    </section>
  </div>
</section>

<!-- Окно создания поста -->
<div class="modal hidden" id="postModal">
  <div class="sheet">
    <div class="sheet-head">
      <button class="icon-btn" id="postClose" title="Закрыть"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      Новый пост
    </div>
    <div class="new-post">
      <div class="ava" id="postAva"></div>
      <textarea id="postInput" placeholder="Что нового?"></textarea>
    </div>
    <div class="new-post-foot">
      <span class="counter" id="postCount"></span>
      <button class="btn small" id="postBtn" disabled>Опубликовать</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ================= Настройки =================
const PROD_SERVER = 'https://dio-myproj1.msk1.amvera.tech';
const IS_LOCAL = ['localhost', '127.0.0.1', ''].includes(location.hostname);
// Для отладки адрес можно переопределить: localStorage.dio_server = 'http://...'
const SERVER = (store('dio_server') || (IS_LOCAL ? 'http://localhost:8080' : PROD_SERVER)).replace(/\/$/, '');
const WS_URL = SERVER.replace(/^http/, 'ws') + '/ws';

const DEVICE = document.documentElement.dataset.device; // 'phone' | 'pc'
const TYPING_SEND_EVERY = 3000; // не чаще раза в 3 с шлём «печатает»
const TYPING_SHOW_FOR = 5000;   // индикатор гаснет сам, если сигналы прекратились
const PING_EVERY = 20000;       // проверка, что соединение живое
const PONG_WAIT = 8000;
const SEND_TIMEOUT = 10000;     // нет подтверждения — помечаем сообщение «не отправлено»
const POST_MAX = 5000;

const ICON = {
  heart: '<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
};

// ================= Состояние =================
const S = {
  token: store('dio_token'),
  me: null,
  view: '',
  // сообщения
  chats: new Map(),   // id -> чат
  chatsLoaded: false,
  msgs: new Map(),    // id чата -> { list, more, loaded, busy }
  pending: new Map(), // cid -> сообщение, ещё не подтверждённое сервером

// ================= Утилиты =================
function store(k, v) {
  try {
    if (arguments.length === 1) return localStorage.getItem(k);
    v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v);
  } catch { return null; }
}
const $ = id => document.getElementById(id);
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text; // только textContent — защита от XSS
  return e;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
const newCid = () => crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
const sameUser = (a, b) => String(a).toLowerCase() === String(b).toLowerCase();

// «Компактный» режим: телефон или узкое окно на ПК — сообщения показываются по одному экрану
function updateCompact() { document.documentElement.classList.toggle('compact', DEVICE === 'phone' || innerWidth < 760); }
const isCompact = () => document.documentElement.classList.contains('compact');
updateCompact();
addEventListener('resize', updateCompact);

function plural(n, forms) { // plural(5, ['пост','поста','постов'])
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return forms[2];
  if (b > 1 && b < 5) return forms[1];
  if (b === 1) return forms[0];
  return forms[2];
}
const pad = n => String(n).padStart(2, '0');
const hm = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
function dayLabel(ts) {
  const t = new Date();
  if (sameDay(ts, t)) return 'Сегодня';
  const y = new Date(t); y.setDate(t.getDate() - 1);
  if (sameDay(ts, y)) return 'Вчера';
  const d = new Date(ts);
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: d.getFullYear() !== t.getFullYear() ? 'numeric' : undefined });
}
const listTime = ts => sameDay(ts, Date.now()) ? hm(ts) : new Date(ts).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
function postTime(ts) {
  const diff = Date.now() - ts;
  if (diff < 60e3) return 'только что';
  if (diff < 3600e3) return Math.floor(diff / 60e3) + ' мин';
  if (diff < 86400e3) return Math.floor(diff / 3600e3) + ' ч';
  const d = new Date(ts);
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: d.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined });
}
function lastSeenText(u) {
  if (u.online) return 'в сети';
  if (!u.last_seen) return 'был(а) давно';
  const diff = Date.now() - u.last_seen;
  if (diff < 60e3) return 'был(а) только что';
  if (diff < 3600e3) return `был(а) ${Math.floor(diff / 60e3)} мин. назад`;
  if (sameDay(u.last_seen, Date.now())) return 'был(а) в ' + hm(u.last_seen);
  return 'был(а) ' + dayLabel(u.last_seen).toLowerCase() + ' в ' + hm(u.last_seen);
}

const COLORS = ['#e17076', '#7bc862', '#e5ca77', '#65aadd', '#a695e7', '#ee7aae', '#6ec9cb', '#faa774'];
function setAva(node, u, online) {
  node.textContent = ((u.name || u.username || '?').trim()[0] || '?').toUpperCase();
  node.style.background = COLORS[u.id % COLORS.length];

}
function autosize(t, max) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, max) + 'px'; }

let connTimer = 0;
function showConn(text) { // с задержкой, чтобы не мигать при быстром переподключении
  clearTimeout(connTimer);

// ================= HTTP API =================
async function api(path, opts = {}) {
  const headers = {};
  if (opts.body) headers['Content-Type'] = 'application/json';
  if (S.token) headers.Authorization = 'Bearer ' + S.token;
  const res = await fetch(SERVER + path, {
    method: opts.method || 'GET', headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && S.token && !opts.noLogout) logout(false);
  if (!res.ok) throw new Error(data.error || 'Ошибка ' + res.status);
  return data;
}

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {

});

$('authForm').onsubmit = async e => {

};

async function logout(callServer = true) {
  if (callServer && S.token) await api('/api/logout', { method: 'POST', noLogout: true }).catch(() => {});
  store('dio_token', null);
  location.hash = '';
  location.reload();
}

async function start() {
  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');
  while (!S.me) {
    try { S.me = await api('/api/me'); }
    catch (e) { if (!S.token) return; showConn('Сервер недоступен, повторяю…'); await sleep(3000); }
  }
  hideConn();
  renderMe();

// ================= Навигация (адреса вида #/feed, #/messages/12, #/u/login) =================

addEventListener('hashchange', () => { navDepth++; route(); });

// Новый пост: окно по кнопке «Создать»
$('createBtn').onclick = openComposer;
$('postClose').onclick = closeComposer;
$('postModal').addEventListener('mousedown', e => { if (e.target === $('postModal')) closeComposer(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('postModal').classList.contains('hidden')) closeComposer(); });
function openComposer() {
  $('postModal').classList.remove('hidden');
  updateCounter();
  $('postInput').focus();
}
function closeComposer() {

$('postInput').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) publish(); });
$('postBtn').onclick = publish;
function updateCounter() {
  const n = $('postInput').value.trim().length;
  const left = POST_MAX - n;
  $('postCount').textContent = left < 500 ? left : '';
  $('postCount').classList.toggle('over', left < 0);
  $('postBtn').disabled = !n || left < 0;
}
async function publish() {
  const body = $('postInput').value.trim();
  if (!body || body.length > POST_MAX) return;
  $('postBtn').disabled = true;

    const p = await api('/api/posts', { method: 'POST', body: { body } });
    $('postInput').value = '';
    $('postInput').style.height = '';
    closeComposer();

    if (S.prof && S.prof.id === S.me.id) { prependPost(PROF, p); S.prof.posts++; renderProfile(); }
  } catch (e) { alert(e.message); }

// --- списки постов ---
function cachePost(p) { S.posts.set(p.id, p); }

async function loadList(L, reset) {
  if (reset) {
    L.gen++; L.ids = []; L.more = true; L.busy = false; L.error = false;
    $(L.box).replaceChildren();
  }
  if (L.busy || !L.more) return updateLoader(L);
  const gen = L.gen;
  L.busy = true; L.error = false;
  updateLoader(L);
  const last = L.ids[L.ids.length - 1];
  try {
    const r = await api(L.url() + (last ? '&before=' + last : ''));
    if (gen !== L.gen) return; // пока грузили, список сбросили (сменили вкладку/профиль)
    for (const p of r.posts) {
      cachePost(p);
      if (L.ids.includes(p.id)) continue;
      L.ids.push(p.id);
      $(L.box).append(postNode(p));
    }
    L.more = r.more;
  } catch {
    if (gen === L.gen) L.error = true;
  } finally {
    if (gen === L.gen) {
      L.busy = false;
      updateLoader(L);
      if (L.more && !L.error && nearScreen($(L.loader))) loadList(L); // экран ещё не заполнен — догружаем
    }
  }
}

function updateLoader(L) {
  const n = $(L.loader);
  if (L.busy) n.textContent = 'Загрузка…';
  else if (L.error) n.textContent = 'Не удалось загрузить. Прокрутите, чтобы повторить';
  else if (!L.more && !L.ids.length) n.textContent = L.empty();
  else n.textContent = '';
}

function nearScreen(node) {
  if (!node.offsetParent) return false;
  return node.getBoundingClientRect().top < innerHeight + 600;
}

// Подгрузка при прокрутке
const io = new IntersectionObserver(entries => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    const L = e.target.id === 'feedMore' ? FEED : PROF;
    L.error = false;
    loadList(L);
  }
}, { rootMargin: '600px' });
io.observe($('feedMore'));
io.observe($('profMore'));

function prependPost(L, p) {
  if (L.ids.includes(p.id)) return;
  L.ids.unshift(p.id);
  $(L.box).prepend(postNode(p));
  updateLoader(L);
}

function postNode(p) {
  const art = el('article', 'post');
  art.dataset.post = p.id;
  const openAuthor = () => go('u/' + encodeURIComponent(p.author.username));
  const ava = el('div', 'ava');
  setAva(ava, p.author, false);
  ava.onclick = openAuthor;
  const main = el('div', 'post-main');
  const head = el('div', 'post-head');
  const name = el('span', 'post-name', p.author.name);
  name.onclick = openAuthor;
  head.append(name);
  if (p.author.verified) head.append(verifiedBadge());
  head.append(el('span', 'post-sub', '@' + p.author.username + ' · ' + postTime(p.created)));
  if (p.author.id === S.me.id) {
    const del = el('button', 'post-del');
    del.title = 'Удалить';
    del.innerHTML = ICON.trash;
    del.onclick = () => deletePost(p.id);
    head.append(del);
  }
  const acts = el('div', 'post-actions');
  const like = el('button', 'act like');
  like.innerHTML = ICON.heart;
  like.append(el('span', 'n'));
  like.onclick = () => toggleLike(p.id);
  acts.append(like);
  main.append(head, el('div', 'post-body', p.body), acts);
  art.append(ava, main);
  paintLike(art, p);
  return art;
}

function verifiedBadge() {
  const b = el('span', 'verified');
  b.title = 'Официальный аккаунт';
  b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>';
  return b;
}

function paintLike(node, p) {
  const like = node.querySelector('.like');
  like.classList.toggle('liked', p.liked);
  like.title = p.liked ? 'Убрать лайк' : 'Нравится';
  like.querySelector('.n').textContent = p.likes > 0 ? p.likes : '';
}
function repaintPost(id) {
  const p = S.posts.get(id);
  if (p) document.querySelectorAll(`[data-post="${id}"]`).forEach(n => paintLike(n, p));
}

async function toggleLike(id) {
  const p = S.posts.get(id);
  if (!p) return;
  const on = !p.liked;
  p.liked = on; p.likes += on ? 1 : -1; // оптимистично, сразу
  repaintPost(id);
  try {
    const r = await api('/api/posts/like', { method: 'POST', body: { post_id: id, on } });
    p.likes = r.likes; p.liked = r.liked;
  } catch {
    p.liked = !on; p.likes += on ? -1 : 1;
  }
  repaintPost(id);
}

async function deletePost(id) {
  if (!confirm('Удалить пост?')) return;
  try {
    await api('/api/posts/delete', { method: 'POST', body: { id } });
    removePost(id);
  } catch (e) { alert(e.message); }
}

function removePost(id) {
  const p = S.posts.get(id);
  S.posts.delete(id);
  for (const L of [FEED, PROF]) {
    const i = L.ids.indexOf(id);
    if (i >= 0) { L.ids.splice(i, 1); updateLoader(L); }
  }
  document.querySelectorAll(`[data-post="${id}"]`).forEach(n => n.remove());
  if (p && S.prof && S.prof.id === p.author.id && S.prof.posts > 0) { S.prof.posts--; renderProfile(); }
}

// Пост пришёл по WebSocket
function onNewPost(p) {
  if (S.posts.has(p.id)) return; // свой пост уже добавлен после публикации
  cachePost(p);
  if (p.author.id === S.me.id) prependPost(FEED, p); // свой пост с другого устройства
  else if (FEED.loadedOnce) { S.freshCount++; updateFresh(); }
  if (S.prof && S.prof.id === p.author.id) { prependPost(PROF, p); S.prof.posts++; renderProfile(); }
}

// ================= Профиль =================
async function showProfile(username) {
  const mine = sameUser(username, S.me.username);
  setView('profile', mine ? 'me' : '');
  $('profBack').classList.toggle('hidden', mine || navDepth === 0);
  $('profTitle').textContent = mine ? 'Мой профиль' : 'Профиль';
  const req = ++S.profReq;
  const same = S.prof && sameUser(S.prof.username, username);
  if (!same) {
    S.prof = null;
    PROF.gen++; PROF.ids = []; PROF.more = false; PROF.busy = false;
    $('profList').replaceChildren();
    $('profMore').textContent = '';
    $('profHead').replaceChildren(el('div', 'loader', 'Загрузка…'));
    $('vProfile').scrollTop = 0;
  }
  try {
    const u = await api('/api/profile?u=' + encodeURIComponent(username));
    if (req !== S.profReq) return;
    S.prof = u;
    renderProfile();
    if (!same) loadList(PROF, true);
  } catch (e) {
    if (req === S.profReq) $('profHead').replaceChildren(el('div', 'empty', e.message));
  }
}
$('profBack').onclick = () => history.back();

function renderProfile() {
  const u = S.prof;
  if (!u) return;
  const me = u.id === S.me.id;
  const box = $('profHead');
  box.replaceChildren();
  const top = el('div', 'prof-top');

  const btns = el('div', 'prof-btns');
  if (me) {
    const edit = el('button', 'btn small ghost', 'Редактировать');

    const out = el('button', 'btn small ghost', 'Выйти');

    btns.append(edit, out);
  } else {
    const fol = el('button', 'btn small' + (u.i_follow ? ' ghost' : ''), u.i_follow ? 'Вы подписаны' : 'Подписаться');
    fol.onclick = () => toggleFollow(fol);
    const msg = el('button', 'btn small ghost', 'Написать');
    msg.onclick = () => startChat(u.id);
    btns.append(fol, msg);
  }

  if (u.verified) nameEl.append(verifiedBadge());

  const stat = (n, forms) => { const s = el('span'); s.append(el('b', null, n), ' ' + plural(n, forms)); return s; };
  stats.append(
    stat(u.posts, ['пост', 'поста', 'постов']),
    stat(u.followers, ['подписчик', 'подписчика', 'подписчиков']),
    stat(u.following, ['подписка', 'подписки', 'подписок']));
  box.append(stats);
}

function editProfile() {
  const u = S.prof, box = $('profHead');
  box.replaceChildren();
  const name = el('input', 'field');
  name.value = u.name; name.maxLength = 64; name.placeholder = 'Имя';
  const bio = el('textarea', 'field');
  bio.value = u.bio || ''; bio.maxLength = 300; bio.rows = 3; bio.placeholder = 'О себе';
  const err = el('div', 'err');

async function toggleFollow(btn) {
  const u = S.prof;
  btn.disabled = true;
  try {
    const r = await api('/api/follow', { method: 'POST', body: { user_id: u.id, on: !u.i_follow } });
    u.i_follow = r.following;
    u.followers = r.followers;
    if (S.scope === 'following') FEED.loadedOnce = false; // лента подписок изменилась — перезагрузим при входе
  } catch (e) { alert(e.message); }
  if (S.prof === u) renderProfile();
}

// ================= WebSocket =================
function connect() {
  if (!S.token) return;
  clearTimeout(S.reconnectTimer);
  if (S.ws) { S.ws.onclose = S.ws.onmessage = null; try { S.ws.close(); } catch {} }
  const ws = new WebSocket(WS_URL);
  S.ws = ws;
  showConn('Соединение…');
  ws.onopen = () => ws.send(JSON.stringify({ t: 'auth', token: S.token }));
  ws.onmessage = e => { let ev; try { ev = JSON.parse(e.data); } catch { return; } onEvent(ev); };
  ws.onclose = () => { if (S.ws === ws) { S.ws = null; onDisconnected(); } };
}

function onDisconnected() {
  stopPing();
  showConn('Нет соединения, переподключаюсь…');
  clearTimeout(S.reconnectTimer);
  const delay = Math.min(10000, 500 * 2 ** S.retry++) + Math.random() * 300;
  S.reconnectTimer = setTimeout(connect, delay);
}

// Соединение «зависло» (часто бывает на мобильном интернете) — рвём его сами, не дожидаясь браузера.
function dropConnection() {
  const ws = S.ws;
  if (!ws) return;
  ws.onclose = ws.onmessage = null;
  try { ws.close(); } catch {}
  S.ws = null;
  onDisconnected();
}

function wsSend(obj) {
  if (S.ws && S.ws.readyState === WebSocket.OPEN) { S.ws.send(JSON.stringify(obj)); return true; }
  return false;
}

function startPing() {
  stopPing();
  S.pingTimer = setInterval(() => {
    wsSend({ t: 'ping' });
    clearTimeout(S.pongTimer);
    S.pongTimer = setTimeout(dropConnection, PONG_WAIT);
  }, PING_EVERY);
}
function stopPing() { clearInterval(S.pingTimer); clearTimeout(S.pongTimer); }

function reconnectNow() {
  if (!S.token || !S.me) return;
  if (!S.ws || S.ws.readyState > WebSocket.OPEN) { S.retry = 0; connect(); }
}
addEventListener('online', reconnectNow);

function onEvent(ev) {
  switch (ev.t) {
    case 'ready':
      S.me = Object.assign(S.me || {}, ev.user); renderMe();
      S.retry = 0; hideConn(); startPing();
      for (const p of S.pending.values()) dispatchPending(p); // переотправка (сервер отсеет дубли по cid)
      resync();
      break;
    case 'pong':
      clearTimeout(S.pongTimer);
      break;
    case 'error':
      if (ev.error === 'auth') { logout(false); break; }
      if (ev.cid && S.pending.has(ev.cid)) {
        const p = S.pending.get(ev.cid);
        clearTimeout(p.timer); p.failed = true;
        if (S.current === p.chat_id) renderMsgs();
      }
      break;
    case 'ack': {
      const p = S.pending.get(ev.cid);
      if (p) { clearTimeout(p.timer); S.pending.delete(ev.cid); }
      addMessage(ev.m);
      break;
    }
    case 'msg': addMessage(ev.m); break;
    case 'typing': onTyping(ev.c, ev.u); break;
    case 'read': onRead(ev); break;
    case 'presence': onPresence(ev); break;
    case 'chat':
      if (!S.chats.has(ev.chat.id)) { S.chats.set(ev.chat.id, ev.chat); renderList(); }
      break;
    case 'post': onNewPost(ev.post); break;
    case 'post_del': removePost(ev.p); break;
    case 'likes': {
      const p = S.posts.get(ev.p);
      if (p) { p.likes = ev.n; repaintPost(ev.p); }
      break;
    }
  }
}

// После переподключения: обновляем список чатов и догружаем пропущенное в открытом чате.
async function resync() {
  await loadChats();
  for (const id of [...S.msgs.keys()]) if (id !== S.current) S.msgs.delete(id);
  const id = S.current, box = S.msgs.get(id);
  if (box && box.loaded) {
    const last = box.list.length ? box.list[box.list.length - 1].id : 0;
    try {
      const r = await api(`/api/messages?chat=${id}` + (last ? `&after=${last}` : ''));
      box.list = mergeMsgs(box.list, r.messages);
      if (!last) box.more = r.more;
      if (S.current === id) renderMsgs();
    } catch {}
  }
  markRead();
}

// ================= Сообщения: список чатов =================
async function loadChats() {
  try {
    const list = await api('/api/chats');
    S.chats = new Map(list.map(c => [c.id, c]));
    S.chatsLoaded = true;
    renderList();
    renderHead();
    // если открыли ссылку на чат до того, как загрузился список
    const want = chatFromHash();
    if (S.view === 'messages' && want && S.current !== want && S.chats.has(want)) openChat(want);
  } catch {}
}

function chatFromHash() {
  const m = location.hash.match(/^#\/messages\/(\d+)/);
  return m ? Number(m[1]) : 0;
}

function showMessages(chatId) {
  setView('messages', 'messages');
  if (chatId && S.chats.has(chatId)) { if (S.current !== chatId) openChat(chatId); }
  else if (!chatId || S.chatsLoaded) closeChat();
}

const chatTime = c => c.last ? c.last.created : (c._t || 0);

function renderList() {
  updateUnread();
  if (searchMode) return; // сейчас на экране результаты поиска
  const list = $('list');
  list.replaceChildren();
  const chats = [...S.chats.values()].sort((a, b) => chatTime(b) - chatTime(a));
  if (!chats.length) list.append(el('div', 'empty', 'Чатов пока нет. Найдите собеседника через поиск сверху.'));
  for (const c of chats) list.append(chatItem(c));
}

function chatItem(c) {
  const it = el('div', 'item' + (c.id === S.current ? ' on' : ''));
  const ava = el('div', 'ava');
  setAva(ava, c.peer, c.peer.online);
  const meta = el('div', 'meta');
  const r1 = el('div', 'row');
  r1.append(el('div', 'title', c.peer.name));
  if (c.last) r1.append(el('div', 'time', listTime(c.last.created)));
  const r2 = el('div', 'row');
  const typing = S.typing.has(c.id);
  const text = typing ? 'печатает…'
    : c.last ? (c.last.user_id === S.me?.id ? 'Вы: ' : '') + c.last.body.replace(/\s+/g, ' ')
    : '@' + c.peer.username;
  r2.append(el('div', 'prev' + (typing ? ' typing' : ''), text));
  if (c.unread > 0) r2.append(el('div', 'badge', c.unread > 99 ? '99+' : c.unread));
  meta.append(r1, r2);
  it.append(ava, meta);
  it.onclick = () => go('messages/' + c.id);
  return it;
}

function updateUnread() {
  let n = 0;
  for (const c of S.chats.values()) n += c.unread || 0;
  document.title = n ? `(${n}) dio` : 'dio';
  $('navBadge').textContent = n > 99 ? '99+' : n;
  $('navBadge').classList.toggle('hidden', !n);
}

// ================= Сообщения: поиск людей =================
$('search').oninput = () => {
  clearTimeout(searchTimer);
  const q = $('search').value.trim();
  if (!q) { searchMode = false; renderList(); return; }
  searchMode = true;
  searchTimer = setTimeout(async () => {
    try {
      const users = await api('/api/users?q=' + encodeURIComponent(q));
      if ($('search').value.trim() !== q) return;
      const list = $('list');
      list.replaceChildren(el('div', 'section', 'Люди'));
      if (!users.length) list.append(el('div', 'empty', 'Никого не нашли'));
      for (const u of users) {
        const it = el('div', 'item');
        const ava = el('div', 'ava');
        setAva(ava, u, u.online);
        const meta = el('div', 'meta');
        meta.append(el('div', 'title', u.name), el('div', 'prev', '@' + u.username));
        it.append(ava, meta);
        it.onclick = () => startChat(u.id);
        list.append(it);
      }
    } catch {}
  }, 250);
};

async function startChat(userId) {
  try {
    const c = await api('/api/chats/direct', { method: 'POST', body: { user_id: userId } });
    if (!S.chats.has(c.id)) { c._t = Date.now(); S.chats.set(c.id, c); }
    $('search').value = '';
    searchMode = false;
    renderList();
    go('messages/' + c.id);
  } catch (e) { alert(e.message); }
}

// ================= Сообщения: открытый чат =================
async function openChat(id) {
  const c = S.chats.get(id);
  if (!c) return;
  S.current = id;
  S.lastTypingSent = 0;
  document.body.classList.add('in-chat');
  $('placeholder').classList.add('hidden');
  $('chat').classList.remove('hidden');
  renderHead();
  renderList();

  let box = S.msgs.get(id);
  if (!box) { box = { list: [], more: true, loaded: false, busy: false }; S.msgs.set(id, box); }
  renderMsgs(true);
  if (!box.loaded) {
    try {
      const r = await api(`/api/messages?chat=${id}`);
      box.list = mergeMsgs(box.list, r.messages);
      box.more = r.more;
      box.loaded = true;
    } catch {}
    if (S.current === id) renderMsgs(true);
  }
  markRead();
  if (DEVICE === 'pc') $('input').focus();
}

function closeChat() {
  leaveChat();
  $('chat').classList.add('hidden');
  $('placeholder').classList.remove('hidden');
  renderList();
}
function leaveChat() {
  S.current = 0;
  document.body.classList.remove('in-chat');
}
// «Назад» из чата: если пришли из списка — шаг назад по истории (работает и системная кнопка Android)
$('back').onclick = () => navDepth > 0 ? history.back() : go('messages');
const openPeer = () => { const c = S.chats.get(S.current); if (c) go('u/' + encodeURIComponent(c.peer.username)); };
$('peerAva').onclick = openPeer;
$('peerName').onclick = openPeer;

function renderHead() {
  const c = S.chats.get(S.current);
  if (!c) return;
  setAva($('peerAva'), c.peer, c.peer.online);
  $('peerName').textContent = c.peer.name;
  const st = $('peerStatus');
  if (S.typing.has(c.id)) { st.textContent = 'печатает…'; st.className = 'status typing'; }
  else { st.textContent = lastSeenText(c.peer); st.className = 'status' + (c.peer.online ? ' online' : ''); }
}
setInterval(renderHead, 60000); // «был(а) N мин. назад» обновляется само

function mergeMsgs(list, add) {
  const m = new Map(list.map(x => [x.id, x]));
  for (const x of add) m.set(x.id, x);
  return [...m.values()].sort((a, b) => a.id - b.id);
}
const pendingFor = chatId => [...S.pending.values()].filter(p => p.chat_id === chatId);

function renderMsgs(forceBottom = false, keepPosition = false) {
  const c = S.chats.get(S.current);
  if (!c) return;
  const box = S.msgs.get(c.id) || { list: [] };
  const wrap = $('msgs');
  const nearBottom = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 80;
  const fromBottom = wrap.scrollHeight - wrap.scrollTop;
  const all = [...box.list, ...pendingFor(c.id)];

  wrap.replaceChildren();
  if (box.loaded && !all.length) wrap.append(el('div', 'empty', 'Сообщений пока нет. Напишите первым 👋'));
  let lastDay = '';
  for (const m of all) {
    const day = new Date(m.created).toDateString();
    if (day !== lastDay) { wrap.append(el('div', 'day', dayLabel(m.created))); lastDay = day; }
    const mine = m.user_id === S.me.id;
    const node = el('div', 'msg' + (mine ? ' mine' : '') + (m.pending ? ' pending' : '') + (m.failed ? ' failed' : ''), m.body);
    const info = el('span', 'info', hm(m.created));
    if (mine) {
      let tick;
      if (m.failed) tick = el('span', 'tick', '⚠ повторить');
      else if (m.pending) tick = el('span', 'tick', '🕓');
      else if (m.id <= c.peer_read) tick = el('span', 'tick read', '✓✓');
      else tick = el('span', 'tick', '✓');
      info.append(tick);
    }
    node.append(info);
    if (m.failed) node.onclick = () => dispatchPending(m);
    wrap.append(node);
  }
  if (keepPosition) wrap.scrollTop = wrap.scrollHeight - fromBottom;
  else if (forceBottom || nearBottom) wrap.scrollTop = wrap.scrollHeight;
}

// Подгрузка старых сообщений при прокрутке вверх
$('msgs').addEventListener('scroll', async () => {
  if ($('msgs').scrollTop > 80) return;
  const id = S.current, box = S.msgs.get(id);
  if (!box || !box.loaded || !box.more || box.busy || !box.list.length) return;
  box.busy = true;
  try {
    const r = await api(`/api/messages?chat=${id}&before=${box.list[0].id}`);
    box.list = mergeMsgs(box.list, r.messages);
    box.more = r.more;
    if (S.current === id) renderMsgs(false, true);
  } catch {} finally { box.busy = false; }
});

function addMessage(m) {
  const c = S.chats.get(m.chat_id);
  if (!c) { loadChats(); return; } // чат, которого ещё нет в списке
  const isNew = !c.last || m.id > c.last.id;
  const box = S.msgs.get(m.chat_id);
  if (box && box.loaded) box.list = mergeMsgs(box.list, [m]);
  if (isNew) c.last = m;
  const mine = m.user_id === S.me.id;
  if (mine) c.my_read = Math.max(c.my_read, m.id);
  else {
    stopTyping(c.id);
    if (isNew && m.id > c.my_read) c.unread++;
    if (isNew && (document.hidden || S.current !== c.id)) notify(c, m);
  }
  if (S.current === c.id) { renderMsgs(mine); markRead(); renderHead(); }
  renderList();
}

// ================= Сообщения: отправка =================
$('composer').onsubmit = e => { e.preventDefault(); sendMsg(); };
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && DEVICE === 'pc') { e.preventDefault(); sendMsg(); }
});
$('input').addEventListener('input', () => { autosize($('input'), 160); notifyTyping(); });

function sendMsg() {
  const body = $('input').value.trim();
  if (!body || !S.current) return;
  // Оптимистично: показываем сообщение сразу, галочку ставим после ответа сервера
  const p = { cid: newCid(), chat_id: S.current, user_id: S.me.id, body, created: Date.now(), pending: true };
  S.pending.set(p.cid, p);
  $('input').value = '';
  autosize($('input'), 160);
  S.lastTypingSent = 0;
  dispatchPending(p);
  renderMsgs(true);
  if (DEVICE === 'phone') $('input').focus();
}

function dispatchPending(p) {
  p.failed = false;
  clearTimeout(p.timer);
  wsSend({ t: 'send', c: p.chat_id, body: p.body, cid: p.cid });
  p.timer = setTimeout(() => {
    if (!S.pending.has(p.cid)) return;
    p.failed = true;
    if (S.current === p.chat_id) renderMsgs();
  }, SEND_TIMEOUT);
  if (S.current === p.chat_id) renderMsgs();
}

// ================= «Печатает…», прочитано, онлайн =================
function notifyTyping() {
  if (!S.current || !$('input').value.trim()) return;
  const now = Date.now();
  if (now - S.lastTypingSent < TYPING_SEND_EVERY) return;
  S.lastTypingSent = now;
  wsSend({ t: 'typing', c: S.current });
}

function onTyping(chatId, userId) {
  if (!S.me || userId === S.me.id) return;
  clearTimeout(S.typing.get(chatId));
  S.typing.set(chatId, setTimeout(() => stopTyping(chatId), TYPING_SHOW_FOR));
  renderList();
  if (S.current === chatId) renderHead();
}

function stopTyping(chatId) {
  if (!S.typing.has(chatId)) return;
  clearTimeout(S.typing.get(chatId));
  S.typing.delete(chatId);
  renderList();
  if (S.current === chatId) renderHead();
}

function markRead() {
  const c = S.chats.get(S.current);
  if (!c || document.hidden) return;
  const box = S.msgs.get(c.id);
  const lastLoaded = box && box.list.length ? box.list[box.list.length - 1].id : 0;
  const lastId = Math.max(c.last ? c.last.id : 0, lastLoaded);
  if (lastId > c.my_read) {
    c.my_read = lastId;
    wsSend({ t: 'read', c: c.id, m: lastId });
  }
  if (c.unread) { c.unread = 0; renderList(); }
}

function onRead(ev) {
  const c = S.chats.get(ev.c);
  if (!c) return;
  if (ev.u === S.me.id) { // прочитал на другом своём устройстве
    c.my_read = Math.max(c.my_read, ev.m);
    if (!c.last || ev.m >= c.last.id) c.unread = 0;
    renderList();
  } else {
    c.peer_read = Math.max(c.peer_read, ev.m);
    if (S.current === c.id) renderMsgs();
  }
}

function onPresence(ev) {
  for (const c of S.chats.values()) {
    if (c.peer.id !== ev.u) continue;
    c.peer.online = ev.online;
    if (ev.last_seen) c.peer.last_seen = ev.last_seen;
  }
  if (S.prof && S.prof.id === ev.u) {
    S.prof.online = ev.online;
    if (ev.last_seen) S.prof.last_seen = ev.last_seen;
    if ($('profHead').querySelector('.prof-top')) renderProfile(); // не сбиваем форму редактирования
  }
  renderList();
  renderHead();
}

// ================= Уведомления и видимость =================
function notify(c, m) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    const n = new Notification(c.peer.name, { body: m.body.slice(0, 120), tag: 'dio-' + c.id });
    n.onclick = () => { window.focus(); go('messages/' + c.id); n.close(); };
  } catch {}
}
document.addEventListener('click', () => {
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
}, { once: true });

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  markRead();
  reconnectNow();
});
addEventListener('focus', markRead);

// ================= Старт =================
if (S.token) start();
else $('auth').classList.remove('hidden');
</script>
</body>
</html>
